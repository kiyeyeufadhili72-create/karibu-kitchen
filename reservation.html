<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reservation - KARIBU KITCHEN</title>
<style>
* { box-sizing: border-box; font-family: Arial, sans-serif; }
body { margin: 0; background: #FFF8E7; }
header { background: #0B3D2E; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
.logo { font-size: 22px; font-weight: bold; }
.logo span { color: #FFC107; }
nav a { color: white; text-decoration: none; margin: 0 8px; }
nav a.active { color: #FFC107; }
section { padding: 25px 20px; max-width: 700px; margin: auto; }
input, select, textarea { width: 100%; padding: 11px; margin: 8px 0 15px; border: 1px solid #ccc; border-radius: 6px; }
.btn-gold { background: #FFC107; color: #000; padding: 13px 25px; border: none; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; font-size: 16px; }
footer { background: #0B3D2E; color: white; text-align: center; padding: 20px; }
.res-box { background: white; border: 1px solid #ddd; padding: 12px; margin: 10px 0; border-radius: 8px; }
</style>
</head>
<body>

<header>
  <div class="logo">🍽️ KARIBU <span>KITCHEN</span></div>
  <nav>
    <a href="index.html">Home</a>
    <a href="menu.html">Menu</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
    <a href="reservation.html" class="active">Reservation</a>
  </nav>
</header>

<main>
<section>
  <h2>Make a Reservation</h2>
  <p>Jaza form hii kuweka meza yako. Ukikosea itakuambia error, ukijaza sahihi itakupa confirmation.</p>

  <p id="formError" style="color:red;font-weight:bold;"></p>
  <p id="formSuccess" style="color:green;font-weight:bold;"></p>

  <form id="reservationForm">
    <label>Full Name *</label>
    <input type="text" id="resName" placeholder="e.g. Juma Mwalimu">

    <label>Phone *</label>
    <input type="tel" id="resPhone" placeholder="07XX XXX XXX">

    <label>Date *</label>
    <input type="date" id="resDate">

    <label>Time *</label>
    <input type="time" id="resTime">

    <label>Number of Guests *</label>
    <select id="resGuests">
      <option value="">-- Select --</option>
      <option>1 Person</option>
      <option>2 People</option>
      <option>4 People</option>
      <option>6 People</option>
      <option>8+ People</option>
    </select>

    <label>Special Request (Optional)</label>
    <textarea id="resNote" rows="3" placeholder="e.g. Birthday, window seat"></textarea>

    <button type="submit" class="btn-gold">Confirm Reservation</button>
  </form>

  <h3>Your Reservations (Saved on this computer)</h3>
  <div id="reservationList"></div>
  <button id="clearReservations" style="padding:8px 15px;cursor:pointer;">Clear Reservations</button>
</section>
</main>

<footer><p>KARIBU KITCHEN | Dar es Salaam</p></footer>

<script>
// HII NDIO INAYOFANYA CONFIRM RESERVATION IFANYE KAZI
function showReservations() {
  let list = document.getElementById('reservationList');
  let all = JSON.parse(localStorage.getItem('karibuReservations')) || [];
  list.innerHTML = '';
  if (all.length === 0) {
    list.innerHTML = '<p>No reservations yet.</p>';
    return;
  }
  all.forEach(r => {
    let div = document.createElement('div');
    div.className = 'res-box';
    div.innerHTML = '<strong>' + r.name + '</strong><br>' + r.guests + ' - ' + r.date + ' at ' + r.time + '<br>Phone: ' + r.phone + '<br>Note: ' + (r.note || 'None');
    list.appendChild(div);
  });
}
showReservations();

document.getElementById('reservationForm').addEventListener('submit', function(e) {
  e.preventDefault();
  let name = document.getElementById('resName').value.trim();
  let phone = document.getElementById('resPhone').value.trim();
  let date = document.getElementById('resDate').value;
  let time = document.getElementById('resTime').value;
  let guests = document.getElementById('resGuests').value;
  let note = document.getElementById('resNote').value.trim();
  let err = document.getElementById('formError');
  let ok = document.getElementById('formSuccess');
  err.textContent = ''; ok.textContent = '';

  if (name === '') { err.textContent = 'Please enter your full name.'; return; }
  if (name.length < 3) { err.textContent = 'Name must be at least 3 characters.'; return; }
  if (phone === '' || phone.length < 10) { err.textContent = 'Please enter valid phone (at least 10 digits).'; return; }
  if (date === '') { err.textContent = 'Please select a date.'; return; }
  let today = new Date(); today.setHours(0,0,0,0);
  if (new Date(date) < today) { err.textContent = 'Date cannot be in the past.'; return; }
  if (time === '') { err.textContent = 'Please select a time.'; return; }
  if (guests === '') { err.textContent = 'Please select number of guests.'; return; }

  let all = JSON.parse(localStorage.getItem('karibuReservations')) || [];
  all.push({ name: name, phone: phone, date: date, time: time, guests: guests, note: note });
  localStorage.setItem('karibuReservations', JSON.stringify(all));

  ok.textContent = 'Thank you ' + name + '! Your table for ' + guests + ' on ' + date + ' at ' + time + ' is reserved.';
  showReservations();
  document.getElementById('reservationForm').reset();
});

document.getElementById('clearReservations').addEventListener('click', function() {
  localStorage.removeItem('karibuReservations');
  showReservations();
});
</script>
<script>
document.addEventListener('DOMContentLoaded', function(){
  const form = document.querySelector('form');
  if(!form) return;
  form.addEventListener('submit', function(e){
    e.preventDefault();
    let text = "Habari Karibu Kitchen! Nataka kuorder / kuuliza:%0A%0A";
    form.querySelectorAll('input, textarea, select').forEach(function(el){
      if(el.value && el.type !== 'submit'){
        let label = el.placeholder || el.name || 'Taarifa';
        text += label + ": " + el.value + "%0A";
      }
    });
    window.open('https://wa.me/255742476189?text=' + text, '_blank');
  });
});
</script>
</body>
</html>
